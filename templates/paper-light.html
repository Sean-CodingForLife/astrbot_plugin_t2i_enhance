<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ template_name }}</title>
  <style>
    :root {
      --page: #efebe2;
      --paper: #fffefb;
      --ink: #22262f;
      --ink-soft: #4c5364;
      --ink-dim: #8b91a1;
      --line: #e8e3d8;
      --line-soft: #f1ede4;
      --tint: #f7f4ed;
      --accent: #b45309;
      --accent-soft: rgba(180, 83, 9, 0.12);
      --radius: 14px;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC",
        "Noto Serif CJK SC", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
        "Source Han Sans SC", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html {
      background-color: var(--page);
      background-image: radial-gradient(circle at 1px 1px, rgba(34, 38, 47, 0.07) 1px, transparent 0);
      background-size: 22px 22px;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 52px 26px 60px;
      color: var(--ink);
      font: 16.5px/1.85 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 背景图整页铺底，用浅色蒙层压住以免盖过正文。想不缩放就改成 100% auto。 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      {% if bg_url %}
      background-image:
        linear-gradient(180deg, rgba(255, 254, 251, 0.90) 0%, rgba(255, 254, 251, 0.95) 55%, rgba(239, 235, 226, 0.97) 100%),
        url("{{ bg_url }}");
      background-size: cover, cover;
      background-position: center top, center top;
      background-repeat: no-repeat, no-repeat;
      {% endif %}
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ---------- 页眉 ---------- */
    .head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 0 4px 16px;
      font-size: 13px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-soft);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .brand::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--accent);
      transform: rotate(45deg);
    }
    .head .spacer { flex: 1; }
    .head time {
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 主卡片 ---------- */
    .card {
      position: relative;
      padding: 40px 46px 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow:
        0 1px 2px rgba(35, 30, 20, 0.04),
        0 20px 44px -26px rgba(35, 30, 20, 0.30);
    }
    .card::before {
      content: "";
      position: absolute;
      left: 46px;
      right: 46px;
      top: 0;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: linear-gradient(90deg, var(--accent), rgba(180, 83, 9, 0.15));
    }

    /* ---------- 正文排版 ---------- */
    .md {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }

    .md p { margin: 0 0 1.05em; }

    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
      margin: 1.9em 0 0.72em;
      color: #14171e;
      font-family: var(--serif);
      font-weight: 700;
      line-height: 1.38;
    }
    .md h1 {
      font-size: 1.72em;
      letter-spacing: -0.005em;
    }
    .md h2 {
      padding-left: 13px;
      border-left: 4px solid var(--accent-soft);
      font-size: 1.36em;
    }
    .md h3 { font-size: 1.16em; }
    .md h4 { font-size: 1.04em; color: var(--ink-soft); }
    .md h5, .md h6 {
      font-family: var(--sans);
      font-size: 0.92em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(180, 83, 9, 0.35);
    }

    .md strong { font-weight: 650; color: #14171e; }
    .md em { color: var(--ink-soft); }
    .md del { color: var(--ink-dim); }
    .md mark {
      padding: 0 0.12em;
      background: #fde68a;
      color: #422006;
    }
    .md kbd {
      padding: 0.26em 0.46em;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--tint);
      color: var(--ink-soft);
      font: 600 0.82em/1 var(--mono);
    }
    .md abbr {
      border-bottom: 1px dotted var(--ink-dim);
      text-decoration: none;
    }

    .md ul, .md ol { margin: 0 0 1.05em; padding-left: 1.4em; }
    .md li { margin: 0.38em 0; }
    .md li::marker { color: var(--accent); }
    .md li > ul, .md li > ol { margin: 0.38em 0; }

    .md blockquote {
      margin: 1.3em 0;
      padding: 0.9em 1.15em;
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      background: #fdf8f1;
      color: var(--ink-soft);
    }
    .md blockquote > *:last-child { margin-bottom: 0; }

    .md hr {
      height: 1px;
      margin: 2.1em 0;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .md code {
      padding: 0.15em 0.4em;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--tint);
      color: #9a3412;
      font-family: var(--mono);
      font-size: 0.88em;
      white-space: break-spaces;
    }
    .md pre {
      margin: 1.3em 0;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8f6f1;
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.68;
    }
    .md pre code {
      padding: 0;
      border: 0;
      background: none;
      color: #24292f;
      font-size: 1em;
      white-space: pre;
    }

    .md table {
      width: 100%;
      margin: 1.3em 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      font-size: 0.95em;
    }
    .md th, .md td {
      padding: 0.6em 0.85em;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      overflow-wrap: anywhere;
    }
    .md thead th {
      background: var(--tint);
      color: #14171e;
      font-weight: 650;
      white-space: nowrap;
    }
    .md tbody tr:last-child td { border-bottom: 0; }
    .md tbody tr:nth-child(even) td { background: #fbfaf6; }

    .md img {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .md details {
      margin: 1.2em 0;
      padding: 0.85em 1.1em;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfaf7;
    }
    .md summary { font-weight: 600; color: var(--ink-soft); }
    .md details[open] summary { margin-bottom: 0.7em; }

    .md .admonition {
      margin: 1.3em 0;
      padding: 0.95em 1.15em;
      border: 1px solid var(--line);
      border-left: 3px solid #2563eb;
      border-radius: 0 10px 10px 0;
      background: #f5f8ff;
    }
    .md .admonition-title {
      margin: 0 0 0.5em;
      color: #1e3a8a;
      font-weight: 650;
    }
    .md .admonition.tip { border-left-color: #0d9488; background: #f1fbf8; }
    .md .admonition.warning { border-left-color: #d97706; background: #fffaf0; }
    .md .admonition.danger { border-left-color: #dc2626; background: #fef4f4; }

    .md .toc {
      margin: 1.3em 0;
      padding: 0.9em 1.1em;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #fbfaf7;
      font-size: 0.94em;
    }
    .md .toc::before {
      content: "目录";
      display: block;
      margin-bottom: 0.45em;
      color: var(--ink-dim);
      font-size: 0.78em;
      letter-spacing: 0.14em;
    }
    .md .toc ul { margin: 0; padding-left: 1.2em; }

    /* ---------- 页脚 ---------- */
    .foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 6px 0;
      color: var(--ink-dim);
      font-size: 12.5px;
    }
    .foot .spacer { flex: 1; }
    .foot .ver {
      padding: 2px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 254, 251, 0.7);
      font-family: var(--mono);
      font-size: 11.5px;
    }

    @media (max-width: 640px) {
      body { padding: 28px 14px 36px; font-size: 15.5px; }
      .card { padding: 28px 22px 30px; }
      .card::before { left: 22px; right: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="head">
      <span class="brand">{{ site_name or "AstrBot" }}</span>
      <span class="spacer"></span>
      {% if datetime %}<time>{{ datetime }}</time>{% endif %}
    </header>

    <main class="card">
      <article class="md">{{ content | safe }}</article>
    </main>

    <footer class="foot">
      <span>{{ footer_text or theme_name }}</span>
      <span class="spacer"></span>
      <span class="ver">{{ version }}</span>
    </footer>
  </div>
</body>
</html>
