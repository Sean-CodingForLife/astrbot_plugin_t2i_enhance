<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ template_name }}</title>
  <style>
    :root {
      --ink: #e9efff;
      --ink-soft: #c2cde8;
      --ink-dim: #8b9bbd;
      --line: rgba(255, 255, 255, 0.10);
      --line-soft: rgba(255, 255, 255, 0.055);
      --panel: rgba(15, 21, 37, 0.60);
      --accent: #6cc0ff;
      --accent-2: #b98cff;
      --radius: 20px;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
        "Source Han Sans SC", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html {
      background:
        radial-gradient(1100px 620px at 6% -12%, rgba(108, 192, 255, 0.20), transparent 62%),
        radial-gradient(940px 580px at 102% 2%, rgba(185, 140, 255, 0.17), transparent 64%),
        linear-gradient(168deg, #0b1020 0%, #0a0e1b 46%, #06080f 100%);
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 52px 26px 60px;
      color: var(--ink);
      font: 16.5px/1.85 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 背景图整页铺底。想换成“顶部横幅不缩放”，把 background-size 改成 100% auto 即可。 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: transparent;
      {% if bg_url %}
      background-image:
        linear-gradient(180deg, rgba(7, 10, 20, 0.60) 0%, rgba(7, 10, 20, 0.82) 52%, rgba(6, 8, 15, 0.95) 100%),
        url("{{ bg_url }}");
      background-size: cover, cover;
      background-position: center top, center top;
      background-repeat: no-repeat, no-repeat;
      {% endif %}
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    .page::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -56px;
      width: 560px;
      height: 300px;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(108, 192, 255, 0.20), transparent);
      filter: blur(12px);
      z-index: -1;
    }

    /* ---------- 页眉 ---------- */
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px 18px;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .brand::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 14px rgba(108, 192, 255, 0.70);
    }
    .head .spacer { flex: 1; }
    .head time {
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 主卡片 ---------- */
    .card {
      position: relative;
      padding: 38px 42px 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        0 26px 64px -26px rgba(0, 0, 0, 0.88),
        0 0 0 1px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(108, 192, 255, 0.85), rgba(185, 140, 255, 0.85), transparent);
    }

    /* ---------- 正文排版 ---------- */
    .md {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }

    .md p { margin: 0 0 1.05em; }

    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
      margin: 1.9em 0 0.7em;
      font-weight: 700;
      line-height: 1.35;
      color: #f4f8ff;
    }
    .md h1 {
      position: relative;
      padding-bottom: 0.5em;
      font-size: 1.62em;
      letter-spacing: -0.01em;
    }
    .md h1::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 64px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .md h2 {
      padding-left: 14px;
      border-left: 3px solid rgba(108, 192, 255, 0.55);
      font-size: 1.34em;
    }
    .md h3 { font-size: 1.16em; color: #e3ebff; }
    .md h4 { font-size: 1.03em; color: var(--ink-soft); }
    .md h5, .md h6 {
      font-size: 0.95em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(108, 192, 255, 0.35);
    }

    .md strong { font-weight: 650; color: #ffffff; }
    .md em { color: var(--ink-soft); }
    .md del { color: var(--ink-dim); }
    .md mark {
      padding: 0 0.1em;
      color: #ffffff;
      background: linear-gradient(180deg, transparent 58%, rgba(185, 140, 255, 0.38) 58%);
    }
    .md kbd {
      padding: 0.28em 0.48em;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink-soft);
      font: 600 0.82em/1 var(--mono);
    }
    .md abbr {
      border-bottom: 1px dotted var(--ink-dim);
      text-decoration: none;
    }

    .md ul, .md ol { margin: 0 0 1.05em; padding-left: 1.45em; }
    .md li { margin: 0.4em 0; }
    .md li::marker { color: rgba(108, 192, 255, 0.85); }
    .md li > ul, .md li > ol { margin: 0.4em 0; }

    .md blockquote {
      margin: 1.3em 0;
      padding: 0.9em 1.15em;
      border-left: 3px solid rgba(185, 140, 255, 0.65);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(90deg, rgba(185, 140, 255, 0.10), rgba(185, 140, 255, 0.02));
      color: var(--ink-soft);
    }
    .md blockquote > *:last-child { margin-bottom: 0; }

    .md hr {
      height: 1px;
      margin: 2.1em 0;
      border: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.20), transparent);
    }

    .md code {
      padding: 0.16em 0.42em;
      border: 1px solid rgba(108, 192, 255, 0.18);
      border-radius: 7px;
      background: rgba(108, 192, 255, 0.10);
      color: #a9d9ff;
      font-family: var(--mono);
      font-size: 0.88em;
      white-space: break-spaces;
    }
    .md pre {
      margin: 1.3em 0;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(4, 7, 14, 0.72);
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.68;
    }
    .md pre code {
      padding: 0;
      border: 0;
      background: none;
      color: #dbe6ff;
      font-size: 1em;
      white-space: pre;
    }

    .md table {
      width: 100%;
      margin: 1.3em 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      font-size: 0.95em;
    }
    .md th, .md td {
      padding: 0.62em 0.85em;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      overflow-wrap: anywhere;
    }
    .md thead th {
      background: rgba(255, 255, 255, 0.05);
      color: #eaf1ff;
      font-weight: 650;
      white-space: nowrap;
    }
    .md tbody tr:last-child td { border-bottom: 0; }
    .md tbody tr:nth-child(even) td { background: rgba(255, 255, 255, 0.018); }

    .md img {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .md details {
      margin: 1.2em 0;
      padding: 0.85em 1.1em;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.028);
    }
    .md summary { font-weight: 600; color: var(--ink-soft); }
    .md details[open] summary { margin-bottom: 0.7em; }

    .md .admonition {
      margin: 1.3em 0;
      padding: 0.95em 1.15em;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 0 12px 12px 0;
      background: rgba(108, 192, 255, 0.07);
    }
    .md .admonition-title {
      margin: 0 0 0.5em;
      color: #cfe7ff;
      font-weight: 650;
    }
    .md .admonition.tip { border-left-color: #7ee2b8; background: rgba(126, 226, 184, 0.08); }
    .md .admonition.warning { border-left-color: #ffc46b; background: rgba(255, 196, 107, 0.08); }
    .md .admonition.danger { border-left-color: #ff8f8f; background: rgba(255, 143, 143, 0.08); }

    .md .toc {
      margin: 1.3em 0;
      padding: 0.9em 1.1em;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 0.94em;
    }
    .md .toc::before {
      content: "目录";
      display: block;
      margin-bottom: 0.45em;
      color: var(--ink-dim);
      font-size: 0.78em;
      letter-spacing: 0.14em;
    }
    .md .toc ul { margin: 0; padding-left: 1.2em; }

    /* ---------- 页脚 ---------- */
    .foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 8px 0;
      color: var(--ink-dim);
      font-size: 12.5px;
    }
    .foot .spacer { flex: 1; }
    .foot .ver {
      padding: 2px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11.5px;
    }

    @media (max-width: 640px) {
      body { padding: 28px 14px 36px; font-size: 15.5px; }
      .card { padding: 26px 20px 28px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="head">
      <span class="brand">{{ site_name or "AstrBot" }}</span>
      <span class="spacer"></span>
      {% if datetime %}<time>{{ datetime }}</time>{% endif %}
    </header>

    <main class="card">
      <article class="md">{{ content | safe }}</article>
    </main>

    <footer class="foot">
      <span>{{ footer_text or theme_name }}</span>
      <span class="spacer"></span>
      <span class="ver">{{ version }}</span>
    </footer>
  </div>
</body>
</html>
