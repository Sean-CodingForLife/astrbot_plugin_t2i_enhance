<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ template_name }}</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #111827;
      --ink-soft: #4b5563;
      --ink-dim: #8b95a5;
      --line: #e3e8ef;
      --line-strong: #cfd8e3;
      --tint: #f4f7fb;
      --accent: #2563eb;
      --accent-2: #0891b2;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --radius: 10px;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
        "Source Han Sans SC", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    /* 极淡方格底纹给浅色背景一点结构感：不用光斑、不用圆形装饰。 */
    html {
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(17, 24, 39, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 24, 39, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, #fbfcfe 0%, #f1f5fa 100%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px 56px;
      color: var(--ink);
      font: 16.5px/1.8 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 背景图压一层浅色蒙版，保证正文对比度。 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      {% if bg_url %}
      background-image:
        linear-gradient(180deg, rgba(252, 253, 255, 0.92) 0%, rgba(246, 249, 252, 0.94) 55%, rgba(240, 244, 249, 0.96) 100%),
        url("{{ bg_url }}");
      background-size: cover, cover;
      background-position: center top, center top;
      background-repeat: no-repeat, no-repeat;
      {% endif %}
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 840px;
      margin: 0 auto;
    }

    /* ---------- 页眉 / 页脚：直角小圆角标签，不做胶囊 ---------- */
    .topbar, .footbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar { margin: 0 0 14px; }
    .footbar { margin: 14px 0 0; }
    .spacer { flex: 1; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink-soft);
      font-size: 12.5px;
      letter-spacing: 0.02em;
    }
    .chip.brand {
      color: #1f2937;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .chip .mark {
      width: 8px;
      height: 8px;
      border-radius: 1px;
      background: var(--accent);
    }
    .chip.mono {
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 主卡片：白底 + 顶部实色标尺 ---------- */
    .card {
      position: relative;
      padding: 34px 40px 38px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow:
        0 1px 2px rgba(17, 24, 39, 0.05),
        0 10px 24px -20px rgba(17, 24, 39, 0.45);
    }

    /* ---------- 正文排版 ---------- */
    .md {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }

    .md p { margin: 0 0 1.05em; }

    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
      margin: 1.8em 0 0.66em;
      color: #0f172a;
      font-weight: 700;
      line-height: 1.36;
    }
    .md h1 {
      position: relative;
      padding-bottom: 0.44em;
      font-size: 1.58em;
      letter-spacing: -0.012em;
    }
    .md h1::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 52px;
      height: 3px;
      background: var(--accent);
    }
    .md h2 {
      padding-left: 11px;
      border-left: 3px solid var(--accent);
      font-size: 1.3em;
    }
    .md h3 { font-size: 1.14em; }
    .md h4 { font-size: 1.02em; color: var(--ink-soft); }
    .md h5, .md h6 {
      font-size: 0.9em;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(37, 99, 235, 0.35);
    }

    .md strong { font-weight: 650; color: #0f172a; }
    .md em { color: var(--ink-soft); }
    .md del { color: var(--ink-dim); }
    .md mark {
      padding: 0 0.15em;
      color: #1f2937;
      background: #fde68a;
    }
    .md kbd {
      padding: 0.24em 0.44em;
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 1px 0 rgba(17, 24, 39, 0.06);
      color: var(--ink-soft);
      font: 600 0.82em/1 var(--mono);
    }
    .md abbr {
      border-bottom: 1px dotted var(--ink-dim);
      text-decoration: none;
    }

    .md ul, .md ol { margin: 0 0 1.05em; padding-left: 1.4em; }
    .md ul { list-style-type: square; }
    .md li { margin: 0.36em 0; }
    .md li::marker { color: var(--accent); }
    .md li > ul, .md li > ol { margin: 0.36em 0; }

    .md blockquote {
      margin: 1.25em 0;
      padding: 0.85em 1.1em;
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      background: #f5f8ff;
      color: var(--ink-soft);
    }
    .md blockquote > *:last-child { margin-bottom: 0; }

    .md hr {
      height: 1px;
      margin: 2em 0;
      border: 0;
      background: var(--line);
    }

    .md code {
      padding: 0.14em 0.4em;
      border: 1px solid #dbe3ee;
      border-radius: 4px;
      background: #eef2f7;
      color: #1d4ed8;
      font-family: var(--mono);
      font-size: 0.88em;
      white-space: break-spaces;
    }
    .md pre {
      margin: 1.25em 0;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--line-strong);
      border-radius: 0 6px 6px 0;
      background: #f7f9fb;
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.66;
    }
    .md pre code {
      padding: 0;
      border: 0;
      background: none;
      color: #1f2937;
      font-size: 1em;
      white-space: pre;
    }

    .md table {
      width: 100%;
      margin: 1.25em 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      background: #ffffff;
      font-size: 0.95em;
    }
    .md th, .md td {
      padding: 0.56em 0.82em;
      border-bottom: 1px solid var(--line);
      text-align: left;
      overflow-wrap: anywhere;
    }
    .md thead th {
      border-bottom: 1px solid var(--line-strong);
      background: var(--tint);
      color: #0f172a;
      font-weight: 650;
      white-space: nowrap;
    }
    .md tbody tr:last-child td { border-bottom: 0; }
    .md tbody tr:nth-child(even) td { background: #fafbfd; }

    .md img {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .md details {
      margin: 1.15em 0;
      padding: 0.8em 1.05em;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafbfd;
    }
    .md summary { font-weight: 600; color: #0f172a; }
    .md details[open] summary { margin-bottom: 0.65em; }

    .md .admonition {
      margin: 1.25em 0;
      padding: 0.9em 1.1em;
      border: 1px solid #cddcf7;
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      background: #f2f7ff;
    }
    .md .admonition-title {
      margin: 0 0 0.45em;
      color: #1e40af;
      font-weight: 650;
    }
    .md .admonition.tip { border-color: #c8ebdf; border-left-color: #0d9488; background: #f0fbf8; }
    .md .admonition.tip .admonition-title { color: #0f766e; }
    .md .admonition.warning { border-color: #f6e0b5; border-left-color: #d97706; background: #fff8ec; }
    .md .admonition.warning .admonition-title { color: #b45309; }
    .md .admonition.danger { border-color: #f7d4d4; border-left-color: #dc2626; background: #fef4f4; }
    .md .admonition.danger .admonition-title { color: #b91c1c; }

    .md .toc {
      margin: 1.25em 0;
      padding: 0.85em 1.05em;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      background: #fafbfd;
      font-size: 0.94em;
    }
    .md .toc::before {
      content: "目录";
      display: block;
      margin-bottom: 0.42em;
      color: var(--ink-dim);
      font-size: 0.78em;
      letter-spacing: 0.14em;
    }
    .md .toc ul { margin: 0; padding-left: 1.2em; }

    @media (max-width: 640px) {
      body { padding: 28px 14px 34px; font-size: 15.5px; }
      .card { padding: 24px 18px 26px; border-radius: 8px; }
      .topbar, .footbar { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span class="chip brand"><i class="mark"></i>{{ site_name or "AstrBot" }}</span>
      <span class="spacer"></span>
      {% if datetime %}<span class="chip mono">{{ datetime }}</span>{% endif %}
    </div>

    <main class="card">
      <article class="md">{{ content | safe }}</article>
    </main>

    <div class="footbar">
      <span class="chip">{{ footer_text or theme_name }}</span>
      <span class="spacer"></span>
      <span class="chip mono">{{ version }}</span>
    </div>
  </div>
</body>
</html>
